<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раздача подарков</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --ink:#1f2730; --muted:#6b7785;
    --line:#e2e7ec; --accent:#1f9d55; --accent-ink:#ffffff;
    --danger:#d64545; --warn:#e0962b; --okbg:#e7f6ee; --badbg:#fbeaea;
    --shadow:0 1px 3px rgba(20,30,40,.08),0 4px 16px rgba(20,30,40,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    background:var(--bg);color:var(--ink);font-size:17px;line-height:1.35;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 84px}
  /* top bar */
  .top{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 6px}
  .stats{display:flex;gap:8px}
  .stat{flex:1;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);text-align:center}
  .stat b{display:block;font-size:22px;line-height:1.1}
  .stat span{font-size:12px;color:var(--muted)}
  .conn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(31,157,85,.18)}
  .dot.off{background:#bbb;box-shadow:none}
  .dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(224,150,43,.18)}
  .offline-banner{display:none;background:#fdf2e0;color:#8a5a12;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;text-align:center;margin-top:8px}
  .offline-banner.show{display:block}
  /* search */
  .search{position:sticky;top:74px;z-index:15;background:var(--bg);padding:6px 0 8px}
  .search input{width:100%;font-size:20px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;
    background:var(--card);box-shadow:var(--shadow);outline:none}
  .search input:focus{border-color:var(--accent)}
  /* lists */
  .list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .row{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid transparent}
  .row:active{transform:scale(.99)}
  .row .name{font-size:18px;font-weight:600;flex:1;min-width:0}
  .row .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-ok{background:var(--okbg);color:var(--accent)}
  .b-no{background:#eef1f4;color:var(--muted)}
  .b-given{background:var(--badbg);color:var(--danger)}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
  .hint{text-align:center;color:var(--muted);font-size:13px;padding:8px}
  /* gift picker */
  .gifts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .gift{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer}
  .gift.sel{border-color:var(--accent);background:var(--okbg)}
  .gift .gn{font-weight:600;font-size:15px}
  .gift .gc{font-size:13px;color:var(--muted);margin-top:4px}
  .gift.valuable{border-color:#e0962b;background:#fffaf0}
  .gift.valuable.sel{border-color:#b97a1a;background:#fdf2e0}
  .gift .vb{font-size:11px;font-weight:800;color:#8a5a12;margin-top:4px}
  .gsearch{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px;outline:none}
  .gsearch:focus{border-color:var(--accent)}
  /* buttons */
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:18px;font-weight:700;
    background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:var(--shadow)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.warn{background:var(--warn);color:#fff}
  .btn-row{display:flex;gap:8px;margin-top:10px}
  .mt{margin-top:12px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,20,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .sheet h2{margin:0 0 4px;font-size:22px}
  .sheet .close{position:absolute;top:14px;right:16px;font-size:26px;color:var(--muted);background:none;border:none;cursor:pointer}
  .banner{border-radius:14px;padding:12px 14px;font-weight:700;margin:10px 0;text-align:center}
  .banner.ok{background:var(--okbg);color:var(--accent)}
  .banner.warn{background:#fdf2e0;color:var(--warn)}
  .banner.bad{background:var(--badbg);color:var(--danger)}
  .kv{font-size:15px;color:var(--muted);margin:2px 0}
  .kv b{color:var(--ink)}
  /* tabs */
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:var(--card);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;border:none;background:none;font-size:12px;font-weight:600;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer}
  .tab .ic{font-size:20px}
  .tab.active{color:var(--accent)}
  /* Импорт — шестеренка в углу сверху, не в ряд вкладок */
  .gearbtn{position:fixed;top:10px;right:10px;z-index:45;width:44px;height:44px;border-radius:14px;
    border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;padding:0}
  .gearbtn:active{transform:scale(.95)}
  .gearbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (max-width:760px){
    .top{padding-right:58px}
  }
  /* оператор — на видном месте, сразу видно, задано ли имя */
  .opbox{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--card);
    border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);border:2px solid transparent}
  .opbox.warn{background:#fdf2e0;border-color:#e0962b}
  .op-ic{font-size:20px}
  .op-in{flex:1;font-size:18px;font-weight:700;border:none;background:none;outline:none;padding:4px 0;min-width:0}
  .op-in::placeholder{color:#aab3bd;font-weight:500}
  .op-tip{font-size:12px;color:var(--warn);white-space:nowrap}
  .op-default{color:var(--warn)}
  /* лог */
  .chip{flex:1;font-size:14px;font-weight:600;padding:10px 6px;text-align:center}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .logday{font-weight:800;color:var(--ink);font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.02em}
  .logrow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;
    padding:10px 12px;box-shadow:var(--shadow);border-left:4px solid var(--accent);margin-bottom:8px}
  .logrow.cancel{border-left-color:var(--danger)}
  .logrow.sub{margin-left:20px}
  .sub.link{color:var(--danger);font-weight:600}
  .logrow .lt{font-size:12px;color:var(--muted);min-width:78px;font-variant-numeric:tabular-nums}
  .logrow .lm{flex:1;min-width:0}
  .logrow .lr{text-align:right;min-width:100px}
  /* import */
  textarea,input.t{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:inherit}
  .sec{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
  .sec h3{margin:0 0 8px;font-size:16px}
  .lbl{font-size:13px;color:var(--muted);margin:8px 0 4px}
  .preview{font-size:13px;color:var(--muted);margin-top:8px;max-height:160px;overflow:auto;white-space:pre-wrap}
  .filebtn{position:relative;overflow:hidden;display:inline-block}
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2730;color:#fff;
    padding:12px 18px;border-radius:12px;font-size:15px;z-index:80;box-shadow:var(--shadow);max-width:90%;text-align:center}
  .pill{display:inline-block;font-size:12px;background:#eef1f4;color:var(--muted);border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0}
  .struck{text-decoration:line-through;color:var(--muted)}
  a.dl{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="stats">
      <div class="stat"><b id="s-people">0/0</b><span>получили</span></div>
      <div class="stat"><b id="s-gifts">0/0</b><span>выдано</span></div>
    </div>
    <div class="opbox" id="opbox">
      <span class="op-ic">👤</span>
      <input id="op-top" class="op-in" placeholder="Ваше имя (оператор) — будет записано в лог" autocomplete="off" enterkeyhint="done">
      <span class="op-tip" id="op-tip"></span>
    </div>
    <div class="conn"><span class="dot" id="dot"></span><span id="conn-txt">подключение…</span><span id="queue-txt"></span></div>
    <div class="offline-banner" id="offline-banner"></div>
  </div>

  <div id="view"></div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="razdacha"><span class="ic">🎁</span>Раздача</button>
  <button class="tab" data-tab="podarki"><span class="ic">📦</span>Подарки</button>
  <button class="tab" data-tab="lyudi"><span class="ic">👥</span>Люди</button>
  <button class="tab" data-tab="log"><span class="ic">📋</span>Лог</button>
</div>

<!-- Импорт — не в ряд вкладок, а шестеренка в углу сверху -->
<button class="gearbtn" id="gear" title="Импорт и настройки">⚙️</button>

<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===== Конфиг изолированного проекта Supabase (только это мероприятие) ===== */
const SUPABASE_URL = 'https://vvdegrbjngcgxffqykvj.supabase.co';
const SUPABASE_ANON = 'sb_publishable_5o7z5unD-XLsOXriTBKPEw_e_bRmbK5';

const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

let people = [], gifts = [], handouts = [];
let history = [];             // лог выдач и отмен (через get_handout_log)
let tab = 'razdacha';
let prevTab = 'razdacha';   // откуда пришлось уйти в Импорт (шестеренка)
let searchQ = '';
let podarkiQ = '';
let logFilter = 'all';        // all | give | cancel
let logQ = '';
let selectedPersonId = null;
let selectedGift = null;
let giving = false;           // защита от двойного тапа
let lastLoadOk = false;
let realtimeStatus = 'CONNECTING';
let loadTimer = null;
let cacheAt = null;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = ts => ts ? new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'}).format(new Date(ts)) : '';
const normName = s => String(s||'').trim().replace(/\s+/g,' ');
const normKey = s => normName(s).toLowerCase();
function operatorName(){ return (localStorage.getItem('operator') || 'Волонтёр').slice(0,100); }
/* Имя оператора — на видном месте вверху экрана, чтобы указать его сразу */
function updateOperatorState(){
  const box = $('#opbox'), tip = $('#op-tip');
  if (!box) return;
  const v = operatorName();
  const isDefault = v === 'Волонтёр';
  box.classList.toggle('warn', isDefault);
  if (tip) tip.textContent = isDefault ? 'не задано' : '';
}
function initOperator(){
  const inp = $('#op-top');
  if (!inp) return;
  inp.value = operatorName();
  inp.onchange = () => {
    const v = inp.value.trim().slice(0,100) || 'Волонтёр';
    localStorage.setItem('operator', v);
    inp.value = v;
    updateOperatorState();
    toast('Оператор сохранён');
  };
  inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
  updateOperatorState();
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.display='block';
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.style.display='none', 2600);
}
function translateError(e){
  return ({already_received:'Уже получил(а) подарок',
           person_not_found:'Человек не найден',
           no_gift_available:'Таких подарков больше нет',
           handout_not_found:'Запись не найдена',
           inconsistent_state:'Данные разошлись — обратитесь к диспетчеру',
           invalid_input:'Некорректные данные'})[e] || e;
}
async function rpc(name, params){
  const { data, error } = await sb.rpc(name, params);
  if (error) throw error;
  return data;
}

/* ---------- офлайн-кэш и очередь ---------- */
function saveCache(){
  try{
    localStorage.setItem('cache', JSON.stringify({at: Date.now(), people, gifts, handouts}));
    cacheAt = Date.now();
  }catch(e){ /* переполнение — игнорируем */ }
}
function loadCache(){
  try{
    const c = JSON.parse(localStorage.getItem('cache') || 'null');
    if (!c) return false;
    people = c.people||[]; gifts = c.gifts||[]; handouts = c.handouts||[];
    cacheAt = c.at || null;
    return true;
  }catch(e){ return false; }
}
function getQueue(){
  try{ return JSON.parse(localStorage.getItem('pendingOps') || '[]'); }catch(e){ return []; }
}
function setQueue(q){
  try{ localStorage.setItem('pendingOps', JSON.stringify(q)); }catch(e){}
  updateQueueBadge();
}
function enqueue(op){
  const q = getQueue(); q.push(op); setQueue(q);
  toast('Нет связи — операция в очереди, отправится автоматически');
}
function getFailed(){
  try{ return JSON.parse(localStorage.getItem('failedOps') || '[]'); }catch(e){ return []; }
}
function setFailed(f){
  try{ localStorage.setItem('failedOps', JSON.stringify(f)); }catch(e){}
  updateQueueBadge();
}
function failOp(op, reason){
  const f = getFailed();
  f.push({...op, failed_at: Date.now(), reason});
  setFailed(f);
  toast(`Не отправилось: ${reason} (${op.person_name||op.gift_name||''}) — проверьте вкладку «Импорт»`);
}
function updateQueueBadge(){
  const n = getQueue().length;
  const m = getFailed().length;
  $('#queue-txt').textContent = (n ? `· в очереди: ${n}` : '') + (m ? ` · не отправилось: ${m}` : '');
}
async function processQueue(){
  const q = getQueue();
  if (!q.length) return;
  const rest = [];
  let hadFailure = false;
  for (const op of q){
    try{
      let r = null;
      if (op.type === 'give'){
        r = await rpc('assign_gift', {p_person_id: op.person_id, p_gift_name: op.gift_name, p_operator: op.operator});
      } else if (op.type === 'undo'){
        r = await rpc('unassign_handout', {p_handout_id: op.handout_id, p_operator: op.operator});
      } else if (op.type === 'contact'){
        r = await rpc('update_person_contact', {p_person_id: op.person_id, p_phone: op.phone, p_comment: op.comment});
      }
      if (r && !r.ok){
        // Бизнес-конфликт (уже получил / подарков нет): не ретраим бесконечно,
        // а сохраняем в «не отправилось» для ручного разбора.
        failOp(op, translateError(r.error));
        hadFailure = true;
      }
    }catch(e){
      // Сеть снова пропала — оставляем эту и все следующие в очереди
      rest.push(op);
      const idx = q.indexOf(op);
      for (let j = idx + 1; j < q.length; j++) rest.push(q[j]);
      break;
    }
  }
  setQueue(rest);
  if (q.length) await loadAll();
}

/* ---------- data ---------- */
async function fetchAll(table, orders){
  const pageSize = 1000;
  let from = 0, all = [];
  while (true){
    let q = sb.from(table).select('*');
    for (const [col, asc] of orders) q = q.order(col, {ascending: asc});
    q = q.range(from, from + pageSize - 1);
    const { data, error } = await q;
    if (error) throw error;
    all = all.concat(data || []);
    if (!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}
async function loadAll(){
  if (!sb) return;
  try{
    const [p,g,h] = await Promise.all([
      fetchAll('people', [['full_name', true], ['id', true]]),
      fetchAll('gifts', [['slot_number', true], ['id', true]]),
      fetchAll('handouts', [['created_at', false], ['id', false]])
    ]);
    people = p; gifts = g; handouts = h;
    lastLoadOk = true;
    saveCache();
  }catch(err){
    console.error(err);
    lastLoadOk = false;
    if (!people.length && !loadCache()){
      toast('Нет связи с базой');
    } else {
      toast('Нет связи — показаны последние данные');
    }
  }
  // Лог выдач/отмен: если не получилось — оставляем прежний лог, экран не ломается
  try{
    const log = await rpc('get_handout_log', {p_limit: 2000});
    if (Array.isArray(log)) history = log;
  }catch(e){ /* keep old log */ }
  updateConn();
  render();
}
function updateConn(){
  const dot = $('#dot'), txt = $('#conn-txt'), banner = $('#offline-banner');
  const online = navigator.onLine;
  if (!online){
    dot.className = 'dot off';
    txt.textContent = 'оффлайн (последние данные)';
    banner.textContent = cacheAt ? `Офлайн. Показаны данные на ${fmt(new Date(cacheAt))}. Выдачи ставятся в очередь.` : 'Офлайн. Выдачи ставятся в очередь.';
    banner.classList.add('show');
  } else if (!lastLoadOk){
    dot.className = 'dot off';
    txt.textContent = 'нет связи с базой';
    banner.classList.remove('show');
  } else if (realtimeStatus === 'SUBSCRIBED'){
    dot.className = 'dot';
    txt.textContent = 'все устройства синхронизированы';
    banner.classList.remove('show');
  } else if (realtimeStatus === 'CHANNEL_ERROR' || realtimeStatus === 'TIMED_OUT' || realtimeStatus === 'CLOSED'){
    dot.className = 'dot warn';
    txt.textContent = 'realtime переподключается…';
    banner.classList.remove('show');
  } else {
    dot.className = 'dot warn';
    txt.textContent = 'подключение…';
    banner.classList.remove('show');
  }
  updateQueueBadge();
}
function scheduleLoad(){
  clearTimeout(loadTimer);
  loadTimer = setTimeout(loadAll, 300);
}
function subscribe(){
  if (!sb) return;
  sb.channel('sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'people'}, scheduleLoad)
    .on('postgres_changes',{event:'*',schema:'public',table:'gifts'}, scheduleLoad)
    .on('postgres_changes',{event:'*',schema:'public',table:'handouts'}, scheduleLoad)
    .subscribe(status => { realtimeStatus = status; updateConn(); });
}
function personHandout(pid){ return handouts.find(h => h.person_id === pid); }

/* ---------- views ---------- */
function render(){
  $('#s-people').textContent = `${people.filter(p=>p.received).length}/${people.length}`;
  $('#s-gifts').textContent  = `${gifts.filter(g=>g.status==='given').length}/${gifts.length}`;
  ({razdacha:renderRazdacha, podarki:renderPodarki, lyudi:renderLyudi, log:renderLog, import:renderImport}[tab])();
}

/* простая проверка подарка по запросу: название (без учёта регистра) или слот № */
function giftHit(t, q){
  const ql = String(q||'').trim().toLowerCase();
  if (!ql) return true;
  if (t.name && t.name.toLowerCase().includes(ql)) return true;
  const qd = String(q||'').replace(/\D/g,'');
  return !!(qd && t.slot && String(t.slot).includes(qd));
}

/* Поиск: инпут создаётся один раз, при вводе обновляется ТОЛЬКО список.
   Старая версия перерендеривала весь экран на каждую букву — из-за этого
   текст «стирался», курсор прыгал, на мобильных клавиатура дёргалась. */
function searchListHTML(){
  const q = searchQ.trim().toLowerCase();
  if (!people.length) return `<div class="empty">Список участников пуст.<br>Загрузите его во вкладке «Импорт».</div>`;
  if (!q) return `<div class="hint">Начните вводить фамилию — появятся совпадения</div>`;
  const res = people.filter(p =>
      p.full_name.toLowerCase().includes(q) ||

/* ---------- лог: отдельные записи событий (выдача / отмена), связаны по handout_id ---------- */
/* Каждое событие — своя запись со своим временем; выдача и отмена одной выдачи
   связаны по handout_id и показываются как связанная пара. */
function logGroups(){
  const map = new Map();
  for (const ev of history){
    const key = (ev.handout_id != null ? 'h'+ev.handout_id : 'e'+ev.id);
    let g = map.get(key);
    if (!g){ g = {key, handout_id: ev.handout_id, give:null, cancel:null, events:[]}; map.set(key,g); }
    g.events.push(ev);
    if (ev.event === 'cancel') g.cancel = ev;
    else if (!g.give) g.give = ev;
  }
  const groups = [...map.values()];
  for (const g of groups){
    g.when = g.events.reduce((m,e)=> Math.max(m, new Date(e.created_at).getTime()), 0);
  }
  return groups.sort((a,b)=> b.when - a.when);
}
function logVisibleGroups(){
  const q = logQ.trim().toLowerCase();
  return logGroups().filter(g=>{
    if (logFilter==='give' && !g.give) return false;
    if (logFilter==='cancel' && !g.cancel) return false;
    if (q){
      const hay = g.events.map(e=>[e.person_name,e.gift_name,e.operator,e.cancelled_by].filter(Boolean).join(' ')).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function logListHTML(){
  if (!history.length) return `<div class="empty">Пока нет записей.<br>Выдачи и отмены появятся здесь сразу после действия.</div>`;
  const groups = logVisibleGroups();
  if (!groups.length) return `<div class="empty">Ничего не найдено по «${esc(logQ)}».</div>`;
  const given = history.filter(e=>e.event!=='cancel').length;
  const cancel = history.filter(e=>e.event==='cancel').length;
  let html = `<div class="lbl" style="margin:4px 0 10px">Записей: <b>${history.length}</b> · выдано: <b>${given}</b> · отменено: <b>${cancel}</b> · оператор: <b>${esc(operatorName())}</b></div>`;
  let day = '';
  for (const g of groups){
    const when = new Date(g.cancel ? g.cancel.created_at : g.give.created_at);
    const dk = new Intl.DateTimeFormat('ru-RU',{dateStyle:'full'}).format(when);
    if (dk !== day){ day = dk; html += `<div class="logday">${dk}</div>`; }
    const give = g.give, cancelEv = g.cancel;
    if (logFilter !== 'cancel' && give){
      html += `<div class="logrow give">` +
        `<div class="lt">${fmt(give.created_at)}</div>` +
        `<div class="lm"><div class="name">${esc(give.person_name)}</div><div class="sub">${esc(give.gift_name)}</div></div>` +
        `<div class="lr"><span class="badge b-ok">Выдано</span><div class="sub">${esc(give.operator||'—')}</div>` +
        (cancelEv ? `<div class="sub link">↔ отменена</div>` : '') + `</div></div>`;
    }
    if (logFilter !== 'give' && cancelEv){
      html += `<div class="logrow cancel sub">` +
        `<div class="lt">${fmt(cancelEv.created_at)}</div>` +
        `<div class="lm"><div class="name struck">${esc(cancelEv.person_name)}</div><div class="sub">${esc(cancelEv.gift_name)}</div></div>` +
        `<div class="lr"><span class="badge b-given">Отменено</span><div class="sub">отменил(а): ${esc(cancelEv.cancelled_by||'—')}</div>` +
        (give ? `<div class="sub">выдано: ${fmt(give.created_at)} · ${esc(give.operator||'—')}</div>` : '') + `</div></div>`;
    }
  }
  return html;
}

const VALUABLE_GIFTS = new Set(['колонка алиса']);
function isValuable(name){ return VALUABLE_GIFTS.has(String(name||'').trim().toLowerCase()); }
function giftCardsHTML(query){
  const q = String(query||'').trim();
  const types = giftTypes().filter(t => !q || giftHit(t, q));
  if (!giftTypes().length) return `<div class="empty">Нет доступных подарков</div>`;
  if (!types.length) return `<div class="empty">Ничего не найдено по «${esc(query)}».</div>`;
  return types.map(t=>{
    const val = isValuable(t.name);
    return `<div class="gift${selectedGift===t.name?' sel':''}${val?' valuable':''}" data-g="${esc(t.name)}">${esc(t.name)}<div class="gc">осталось ${t.avail}</div>${val?'<div class="vb">⚠️ ЦЕННЫЙ</div>':''}</div>`;
  }).join('');
}
function bindGiftPicker(){
  const inp = $('#gq');
  const list = $('#glist');

    list.querySelectorAll('.gift').forEach(c=>c.onclick=()=>{

    ${body}
    <div class="sec" style="margin-top:12px;box-shadow:none;border:1px solid var(--line)">
      <div class="lbl">Телефон</div>

  else {
    bindGiftPicker();
    const give = $('#give');
    if (give) give.onclick = ()=>{
      if (!selectedGift) return;
      if (isValuable(selectedGift)){
        const t = giftTypes().find(x=>x.name===selectedGift);
        const left = t ? t.avail : '?';
        if (!confirm(`⚠️ ЦЕННЫЙ ПОДАРОК\n\nВыдать «${selectedGift}» человеку ${p.full_name}?\nОсталось: ${left} шт. (одиночный экземпляр — повторная выдача заблокирована в базе).\n\nПродолжить?`)) return;
        if (!navigator.onLine && !confirm('Вы ОФФЛАЙН. Выдача встанет в очередь и может не отправиться, если другой волонтёр уже выдал этот подарок.\n\nПродолжить в очередь?')) return;

      giveGift(p, selectedGift);
    };
  }
  $('#savep').onclick = ()=>savePerson(pid);
}
function closeModal(){ $('#modal').innerHTML=''; selectedPersonId=null; selectedGift=null; }

async function giveGift(person, giftName){
  if (giving) return;
  giving = true;
  const btn = $('#give');
  if (btn){ btn.disabled = true; btn.textContent = 'Выдаём…'; }
  try{
    const r = await rpc('assign_gift', {p_person_id:person.id, p_gift_name:giftName, p_operator:operatorName()});
    if (!r.ok){
      toast(translateError(r.error));
      if (r.error === 'already_received'){
        closeModal(); await loadAll();
        openPerson(person.id); // показать, что уже выдано и кем
        return;
      }
      closeModal(); return;
    }
    toast(`✓ ${person.full_name} получил(а): ${giftName}`);
  }catch(e){
    console.error(e);
    // Любая сетевая ошибка (не только navigator.onLine=false: Wi-Fi есть, интернета нет)
    // — в очередь. Бизнес-ошибки сюда не попадают, они возвращаются как {ok:false}.
    enqueue({type:'give', person_id: person.id, gift_name: giftName, operator: operatorName(), person_name: person.full_name});
  }finally{ giving = false; }
  closeModal(); await loadAll();
}
async function undoHandout(id){
  if (!confirm('Отменить выдачу? Подарок вернётся в список.')) return;
  try{
    const r = await rpc('unassign_handout', {p_handout_id:id, p_operator: operatorName()});
    if (!r.ok){ toast(translateError(r.error)); return; }
    toast('Выдача отменена');
  }catch(e){
    console.error(e);
    enqueue({type:'undo', handout_id: id, operator: operatorName()});
  }
  closeModal(); await loadAll();
}
async function savePerson(pid){
  const phone = $('#ephone').value.trim()||null;
  const comment = $('#ecomment').value.trim()||null;
  try{
    const r = await rpc('update_person_contact', {p_person_id: pid, p_phone: phone, p_comment: comment});
    if (!r.ok) throw new Error(translateError(r.error));
    toast('Сохранено');
  }catch(e){
    console.error(e);
    enqueue({type:'contact', person_id: pid, phone, comment});
  }
  await loadAll();
}

/* ---------- gifts summary ---------- */
function giftTypes(){
  const map = new Map();
  for (const g of gifts){
    if (!map.has(g.name)) map.set(g.name,{name:g.name,avail:0,slot:null});
    const t = map.get(g.name);
    if (t.slot===null && g.slot_number) t.slot = g.slot_number;
    if (g.status==='available') t.avail++;
  }
  return [...map.values()].filter(t=>t.avail>0).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}

/* ---------- import / export ---------- */
function isPhone(s){ return /^\+?\d[\d\s\-()]{5,}$/.test(s); }
function isMember(s){ return /^\d{1,6}$/.test(s); }
function classifyParts(parts){
  let full_name = null, phone = null, member = null;
  for (const p of parts){
    if (!p) continue;
    if (isPhone(p) && !phone) phone = p;
    else if (isMember(p) && !member) member = p;
    else if (!full_name) full_name = p;
  }
  if (full_name) full_name = normName(full_name);
  return full_name ? {full_name, phone, member_number: member} : null;
}
function parsePeopleText(text){
  const out = [];
  for (let line of String(text||'').split(/\r?\n/)){
    line = line.trim(); if (!line) continue;
    const parts = line.split(/\t|;|,|\s{2,}/).map(s=>s.trim()).filter(Boolean);
    const row = classifyParts(parts);
    if (row) out.push(row);
  }
  return out;
}
function decodeText(buf){
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\ufffd')){
    try{ text = new TextDecoder('windows-1251').decode(buf); }catch(e){}
  }
  return text.replace(/^\ufeff/, '');
}
function parseCSV(text){
  text = String(text||'').replace(/^\ufeff/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  if (!lines.length) return [];
  const delim = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ';' : ',';
  const rows = [];
  let cur = '', row = [], inq = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inq){ if (c==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else inq=false; } else cur+=c; }
    else {
      if (c==='"') inq=true;
      else if (c===delim){ row.push(cur); cur=''; }
      else if (c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=c;
    }
  }
  if (cur!==''||row.length){ row.push(cur); rows.push(row); }
  // заголовок?
  let nameIdx = -1, phoneIdx = -1, memberIdx = -1;
  const first = rows[0] ? rows[0].map(x=>String(x).trim().toLowerCase()) : [];
  first.forEach((h,i)=>{
    if (/(фио|фамил|имя|name)/.test(h)) nameIdx = i;
    else if (/(тел|phone|моб)/.test(h)) phoneIdx = i;
    else if (/(номер|number|№|табел|id)/.test(h)) memberIdx = i;
  });
  const out = [];
  const start = nameIdx >= 0 ? 1 : 0;
  for (let r=start;r<rows.length;r++){
    const cells = rows[r].map(x=>String(x).trim());
    if (!cells.length || cells.every(x=>!x)) continue;
    if (nameIdx >= 0){
      const full_name = normName(cells[nameIdx]||'');
      if (!full_name) continue;
      out.push({full_name, phone: phoneIdx>=0 ? (cells[phoneIdx]||null) : null, member_number: memberIdx>=0 ? (cells[memberIdx]||null) : null});
    } else {
      const parsed = classifyParts(cells.filter(Boolean));
      if (parsed) out.push(parsed);
    }
  }
  return out;
}
function dedupRows(rows){
  const existingNames = new Set(people.map(p=>normKey(p.full_name)));
  const existingMembers = new Set(people.filter(p=>p.member_number).map(p=>String(p.member_number).trim()));
  const seenNames = new Set(), seenMembers = new Set();
  const fresh = [];
  let skipped = 0;
  for (const r of rows){
    const nk = normKey(r.full_name);
    const mk = r.member_number ? String(r.member_number).trim() : null;
    if (existingNames.has(nk) || seenNames.has(nk) || (mk && (existingMembers.has(mk) || seenMembers.has(mk)))){
      skipped++; continue;
    }
    seenNames.add(nk); if (mk) seenMembers.add(mk);
    fresh.push({full_name: normName(r.full_name), phone: r.phone||null, member_number: mk||null});
  }
  return {fresh, skipped};
}
async function insertPeople(rows){
  // порциями по 100, при конфликте — поштучно, чтобы одна плохая строка не роняла весь импорт
  let inserted = 0, failed = 0;
  for (let i=0;i<rows.length;i+=100){
    const chunk = rows.slice(i, i+100);
    const { error } = await sb.from('people').insert(chunk);
    if (!error){ inserted += chunk.length; continue; }
    for (const r of chunk){
      const { error: e2 } = await sb.from('people').insert(r);
      if (e2) failed++; else inserted++;
    }
  }
  return {inserted, failed};
}
function previewImport(){
  const rows = parsePeopleText($('#paste').value);
  const {fresh, skipped} = dedupRows(rows);
  $('#prev').textContent = `Найдено строк: ${rows.length}\nНовых (не в списке): ${fresh.length}\nПропущено дублей: ${skipped}\nПримеры:\n` +
    fresh.slice(0,8).map(r=>`• ${r.full_name}${r.phone?' | '+r.phone:''}${r.member_number?' | №'+r.member_number:''}`).join('\n');
}
async function doImport(){
  const rows = parsePeopleText($('#paste').value);
  if (!rows.length){ toast('Пусто'); return; }
  const {fresh, skipped} = dedupRows(rows);
  if (!fresh.length){ toast(`Все уже в списке (дублей: ${skipped})`); return; }
  try{
    const {inserted, failed} = await insertPeople(fresh);
    toast(`Добавлено ${inserted} чел.${skipped?`, пропущено дублей: ${skipped}`:''}${failed?`, ошибок: ${failed}`:''}`);
    $('#paste').value=''; $('#prev').textContent='';
  }catch(e){ console.error(e); toast('Ошибка импорта: '+(e.message||e)); }
  await loadAll();
}
let xlsxPromise = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxPromise) return xlsxPromise;
  xlsxPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = ()=> resolve(window.XLSX);
    s.onerror = ()=> reject(new Error('Не удалось загрузить библиотеку Excel'));
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
async function importFile(e){
  const f = e.target.files[0]; if (!f) return;
  try{
    const buf = await f.arrayBuffer();
    let rows = [];
    if (f.name.toLowerCase().endsWith('.csv')){
      rows = parseCSV(decodeText(buf));
    } else {
      const XLSX = await loadXLSX();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {defval:''});
      rows = raw.map(r=>{
        const obj = {};
        for (const k in r){
          const key = String(k).toLowerCase();
          if (/(фио|фамил|имя|name)/.test(key)) obj.full_name = normName(String(r[k]));
          else if (/(тел|phone|моб)/.test(key)) obj.phone = String(r[k]).trim() || null;
          else if (/(номер|number|№|табел|id)/.test(key)) obj.member_number = String(r[k]).trim() || null;
        }
        return obj;
      }).filter(r=>r.full_name);
    }
    const {fresh, skipped} = dedupRows(rows);
    if (!fresh.length){ toast(`Нет новых строк (дублей: ${skipped})`); return; }
    const {inserted, failed} = await insertPeople(fresh);
    toast(`Импортировано ${inserted} чел.${skipped?`, пропущено дублей: ${skipped}`:''}${failed?`, ошибок: ${failed}`:''}`);
  }catch(err){ console.error(err); toast('Ошибка файла: '+(err.message||err)); }
  e.target.value = '';
  await loadAll();
}
async function addPerson(){
  const name = normName($('#an').value);
  if (!name){ toast('Введите ФИО'); return; }
  const phone = $('#ap').value.trim()||null;
  if (people.some(p=>normKey(p.full_name)===normKey(name))){ toast('Такой человек уже есть в списке'); return; }
  try{
    const {error}=await sb.from('people').insert({full_name:name, phone});
    if(error) throw error;
    toast('Добавлен(а)'); $('#an').value=''; $('#ap').value='';
  }catch(e){ console.error(e); toast('Ошибка: '+(e.message||e)); }
  await loadAll();
}
async function addGift(){
  const name = normName($('#gn').value);
  const n = Math.min(500, Math.max(1, parseInt($('#gc').value)||1));
  if (!name){ toast('Введите название'); return; }
  try{
    const {error}=await sb.from('gifts').insert(Array.from({length:n},()=>({name})));
    if(error) throw error;
    toast(`Добавлено ${n}× ${name}`); $('#gn').value='';
  }catch(e){ console.error(e); toast('Ошибка: '+(e.message||e)); }
  await loadAll();
}
async function clearPeople(){
  const n = people.filter(p=>!p.received).length;
  if (!confirm(`Удалить всех, кто ещё НЕ получил подарок (${n} чел.)? Получившие останутся.`)) return;
  try{ const {error}=await sb.from('people').delete().eq('received',false); if(error) throw error; toast('Очищено'); }
  catch(e){ console.error(e); toast('Ошибка: '+(e.message||e)); }
  await loadAll();
}
function download(name, content, type){
  const blob = new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportBackup(){
  const data = {version: 2, exported_at:new Date().toISOString(), people, gifts, handouts};
  download('razdadcha-backup-'+Date.now()+'.json', JSON.stringify(data,null,2), 'application/json');
}
function csvCell(v){
  const s = String(v==null?'':v);
  return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
/* полный лог: отдельные записи событий с собственным временем */
function exportLogCSV(){
  const head = 'Действие;ФИО;Подарок;Когда;Кто выдал;Кто отменил\n';
  const body = history.map(e=>{
    const act = e.event === 'cancel' ? 'Отмена' : 'Выдача';
    return [act, e.person_name, e.gift_name, e.created_at, e.operator||'', e.cancelled_by||'']
      .map(csvCell).join(';');
  }).join('\n');
  download('log-vydachi-i-otmen-'+Date.now()+'.csv', '\ufeff'+head+body, 'text/csv;charset=utf-8');
}
async function importBackup(e){
  const f = e.target.files[0]; if (!f) return;
  e.target.value = '';
  try{
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.people) || !Array.isArray(data.gifts) || !Array.isArray(data.handouts)){
      toast('Неверный формат бэкапа'); return;
    }
    if (!confirm(`ВНИМАНИЕ: восстановление ЗАМЕНИТ все текущие данные (${people.length} людей, ${gifts.length} подарков, ${handouts.length} выдач) данными из бэкапа от ${data.exported_at||'?'}. Продолжить?`)) return;
    const r = await rpc('restore_backup', {p_people: data.people, p_gifts: data.gifts, p_handouts: data.handouts});
    if (!r.ok) throw new Error(translateError(r.error||'restore_failed'));
    toast(`Восстановлено: людей ${r.people}, подарков ${r.gifts}, выдач ${r.handouts}`);
  }catch(err){ console.error(err); toast('Ошибка восстановления: '+(err.message||err)); }
  await loadAll();
}

/* ---------- search bind (без перерендера инпута) ---------- */
function bindSearch(){
  const inp = $('#q'); if (!inp) return;
  inp.oninput = e => {
    searchQ = e.target.value;
    const list = $('#list');
    if (!list) return;
    list.innerHTML = (tab === 'lyudi' ? renderLyudiList() : searchListHTML());
    list.querySelectorAll('.row[data-pid]').forEach(r=>r.onclick=()=>openPerson(+r.dataset.pid));
  };
  const list = $('#list');
  if (list) list.querySelectorAll('.row[data-pid]').forEach(r=>r.onclick=()=>openPerson(+r.dataset.pid));
  // автофокус только на десктопе — на телефоне он дёргает клавиатуру
  if (window.matchMedia && window.matchMedia('(hover: hover)').matches){
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 50);
  }
}

/* ---------- tabs ---------- */
function setTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===name));
  const g = $('#gear');
  if (g) g.classList.toggle('active', name==='import');
  tab = name;
  searchQ=''; podarkiQ='';
  render();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
// шестеренка в углу: открывает Импорт, ещё раз — возвращает на предыдущую вкладку
$('#gear').onclick = ()=>{
  if (tab === 'import') setTab(prevTab || 'razdacha');
  else { prevTab = tab; setTab('import'); }
};

/* ---------- online/offline ---------- */
window.addEventListener('online', ()=>{ updateConn(); processQueue(); loadAll(); });
window.addEventListener('offline', ()=>{ updateConn(); });

/* ---------- boot ---------- */
(async function boot(){
  if (!sb){ document.getElementById('view').innerHTML='<div class="empty">Не удалось загрузить библиотеку Supabase (нужен интернет). Обновите страницу.</div>'; return; }
  initOperator(); // имя оператора на видном месте
  loadCache(); render(); // мгновенный показ кэша, потом свежие данные
  await loadAll();
  subscribe();
  setInterval(loadAll, 60000); // периодическая перепроверка на всякий случай
  processQueue();
})();
</script>
